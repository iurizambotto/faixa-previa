<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" width="1040" height="400" role="img"><title>Arquitetura da proposta</title><desc>Fontes públicas do TCESP (matriz oficial, manual da edição, CSV de respostas e faixas oficiais) e dados do próprio município (AUDESP e balancetes) entram na ingestão, versionada por edição. A ingestão alimenta o motor de cálculo, validado contra as faixas oficiais de 644 municípios em 11 anos-base. O motor alimenta o diagnóstico, que gera o relatório e a lista de evidências. O AUDESP permite preenchimento prévio dos itens calculados: 850 de 1000 pontos no i-Fiscal e 650 de 1000 no i-Plan.</desc><style>
.dg-bg{fill:#f3f6f5}.dg-frame{fill:none;stroke:#a9b8b8;stroke-width:1}
.dg-box{fill:#ffffff;stroke:#a9b8b8;stroke-width:1}.dg-core{fill:#00616a;stroke:none}
.dg-own{fill:#fff6d6;stroke:#d9ad1f;stroke-width:1}
.dg-t{fill:#0f2228;font:600 14px 'Atkinson Hyperlegible Next',system-ui,sans-serif}
.dg-s{fill:#3f5258;font:400 12.5px 'Atkinson Hyperlegible Next',system-ui,sans-serif}
.dg-h{fill:#3f5258;font:600 11.5px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.06em}
.dg-core-t{fill:#ffffff;font:700 15px 'Atkinson Hyperlegible Next',system-ui,sans-serif}
.dg-core-s{fill:#d8eef0;font:400 12.5px 'Atkinson Hyperlegible Next',system-ui,sans-serif}
.dg-arrow{fill:none;stroke:#3f5258;stroke-width:1.5}.dg-arrow-own{fill:none;stroke:#b8901a;stroke-width:1.5}
.dg-head{fill:#3f5258}.dg-head-own{fill:#b8901a}
@media (prefers-color-scheme:dark){
.dg-bg{fill:#0e1517}.dg-frame{stroke:#3b4d51}.dg-box{fill:#152024;stroke:#3b4d51}
.dg-core{fill:#73c3cc}.dg-own{fill:#2a2512;stroke:#b8901a}
.dg-t{fill:#e6eeef}.dg-s,.dg-h{fill:#b2c1c4}.dg-core-t{fill:#0b1214}.dg-core-s{fill:#123a40}
.dg-arrow{stroke:#b2c1c4}.dg-head{fill:#b2c1c4}.dg-arrow-own{stroke:#e3b831}.dg-head-own{fill:#e3b831}}
</style><rect class="dg-bg" x="0" y="0" width="1040" height="400"/><text class="dg-h" x="16" y="24" text-anchor="start"><tspan x="16" dy="0">DADOS DO PRÓPRIO MUNICÍPIO</tspan></text><rect class="dg-own" x="16" y="36" width="210" height="56" rx="6"/><text class="dg-t" x="28" y="58" text-anchor="start"><tspan x="28" dy="0">AUDESP e balancetes</tspan></text><text class="dg-s" x="28" y="77" text-anchor="start"><tspan x="28" dy="0">entregas do próprio município</tspan></text><text class="dg-s" x="372" y="48" text-anchor="start"><tspan x="372" dy="0">Preenchimento prévio de itens calculados:</tspan><tspan x="372" dy="17">i-Fiscal, 850 de 1000 pontos;</tspan><tspan x="372" dy="17">i-Plan, 650 de 1000 pontos.</tspan></text><text class="dg-h" x="16" y="124" text-anchor="start"><tspan x="16" dy="0">FONTES PÚBLICAS DO TCESP</tspan></text><rect class="dg-box" x="16" y="136" width="210" height="52" rx="6"/><text class="dg-t" x="28" y="158" text-anchor="start"><tspan x="28" dy="0">Matriz oficial</tspan></text><text class="dg-s" x="28" y="177" text-anchor="start"><tspan x="28" dy="0">planilha de instrução</tspan></text><rect class="dg-box" x="16" y="200" width="210" height="52" rx="6"/><text class="dg-t" x="28" y="222" text-anchor="start"><tspan x="28" dy="0">Manual da edição</tspan></text><text class="dg-s" x="28" y="241" text-anchor="start"><tspan x="28" dy="0">fórmulas e regras</tspan></text><rect class="dg-box" x="16" y="264" width="210" height="52" rx="6"/><text class="dg-t" x="28" y="286" text-anchor="start"><tspan x="28" dy="0">CSV de respostas</tspan></text><text class="dg-s" x="28" y="305" text-anchor="start"><tspan x="28" dy="0">painel, por ano-base</tspan></text><rect class="dg-box" x="16" y="328" width="210" height="52" rx="6"/><text class="dg-t" x="28" y="350" text-anchor="start"><tspan x="28" dy="0">Faixas oficiais</tspan></text><text class="dg-s" x="28" y="369" text-anchor="start"><tspan x="28" dy="0">painel, 644 municípios</tspan></text><rect class="dg-box" x="276" y="150" width="150" height="130" rx="6"/><text class="dg-t" x="288" y="172" text-anchor="start"><tspan x="288" dy="0">Ingestão</tspan></text><text class="dg-s" x="288" y="191" text-anchor="start"><tspan x="288" dy="0">versionada</tspan><tspan x="288" dy="16">por edição</tspan><tspan x="288" dy="16">do índice</tspan></text><rect class="dg-core" x="476" y="150" width="180" height="130" rx="6"/><text class="dg-core-t" x="488" y="172" text-anchor="start"><tspan x="488" dy="0">Motor de cálculo</tspan></text><text class="dg-core-s" x="488" y="191" text-anchor="start"><tspan x="488" dy="0">sete índices,</tspan><tspan x="488" dy="16">rebaixamentos</tspan><tspan x="488" dy="16">e faixa geral;</tspan><tspan x="488" dy="16">regras abertas</tspan></text><rect class="dg-box" x="476" y="326" width="180" height="56" rx="6"/><text class="dg-t" x="488" y="348" text-anchor="start"><tspan x="488" dy="0">Validação</tspan></text><text class="dg-s" x="488" y="367" text-anchor="start"><tspan x="488" dy="0">644 municípios, 11 anos</tspan></text><rect class="dg-box" x="706" y="150" width="160" height="130" rx="6"/><text class="dg-t" x="718" y="172" text-anchor="start"><tspan x="718" dy="0">Diagnóstico</tspan></text><text class="dg-s" x="718" y="191" text-anchor="start"><tspan x="718" dy="0">pontos na mesa:</tspan><tspan x="718" dy="16">norma, processo</tspan><tspan x="718" dy="16">ou investimento;</tspan><tspan x="718" dy="16">simulação e se</tspan></text><rect class="dg-box" x="906" y="100" width="124" height="92" rx="6"/><text class="dg-t" x="918" y="122" text-anchor="start"><tspan x="918" dy="0">Relatório</tspan></text><text class="dg-s" x="918" y="141" text-anchor="start"><tspan x="918" dy="0">prefeito e</tspan><tspan x="918" dy="16">secretarias</tspan></text><rect class="dg-box" x="906" y="240" width="124" height="92" rx="6"/><text class="dg-t" x="918" y="262" text-anchor="start"><tspan x="918" dy="0">Evidências</tspan></text><text class="dg-s" x="918" y="281" text-anchor="start"><tspan x="918" dy="0">documento por</tspan><tspan x="918" dy="16">resposta Sim</tspan></text><path class="dg-arrow" d="M226,162 L251,162"/><path class="dg-arrow" d="M226,226 L251,226"/><path class="dg-arrow" d="M226,290 L251,290"/><path class="dg-arrow" d="M251,162 L251,290"/><path class="dg-arrow" d="M251,215 L276,215"/><path class="dg-head" d="M276,215 L268,210.5 L268,219.5 Z"/><path class="dg-arrow-own" d="M226,64 L351,64 L351,150"/><path class="dg-head-own" d="M351,150 L346.5,142 L355.5,142 Z"/><path class="dg-arrow" d="M426,215 L476,215"/><path class="dg-head" d="M476,215 L468,210.5 L468,219.5 Z"/><path class="dg-arrow" d="M226,354 L476,354"/><path class="dg-head" d="M476,354 L468,349.5 L468,358.5 Z"/><path class="dg-arrow" d="M566,326 L566,280"/><path class="dg-head" d="M566,280 L561.5,288 L570.5,288 Z"/><path class="dg-arrow" d="M656,215 L706,215"/><path class="dg-head" d="M706,215 L698,210.5 L698,219.5 Z"/><path class="dg-arrow" d="M866,195 L886,195 L886,146 L906,146"/><path class="dg-head" d="M906,146 L898,141.5 L898,150.5 Z"/><path class="dg-arrow" d="M866,235 L886,235 L886,286 L906,286"/><path class="dg-head" d="M906,286 L898,281.5 L898,290.5 Z"/></svg>
