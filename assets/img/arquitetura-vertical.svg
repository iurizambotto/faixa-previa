<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 920" width="360" height="920" role="img"><title>Arquitetura da proposta</title><desc>Fontes públicas do TCESP (matriz oficial, manual da edição, CSV de respostas e faixas oficiais) e dados do próprio município (AUDESP e balancetes) entram na ingestão, versionada por edição. A ingestão alimenta o motor de cálculo, validado contra as faixas oficiais de 644 municípios em 11 anos-base. O motor alimenta o diagnóstico, que gera o relatório e a lista de evidências. O AUDESP permite preenchimento prévio dos itens calculados: 850 de 1000 pontos no i-Fiscal e 650 de 1000 no i-Plan.</desc><style>
.dg-bg{fill:#f3f6f5}.dg-frame{fill:none;stroke:#a9b8b8;stroke-width:1}
.dg-box{fill:#ffffff;stroke:#a9b8b8;stroke-width:1}.dg-core{fill:#00616a;stroke:none}
.dg-own{fill:#fff6d6;stroke:#d9ad1f;stroke-width:1}
.dg-t{fill:#0f2228;font:600 14px 'Atkinson Hyperlegible Next',system-ui,sans-serif}
.dg-s{fill:#3f5258;font:400 12.5px 'Atkinson Hyperlegible Next',system-ui,sans-serif}
.dg-h{fill:#3f5258;font:600 11.5px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.06em}
.dg-core-t{fill:#ffffff;font:700 15px 'Atkinson Hyperlegible Next',system-ui,sans-serif}
.dg-core-s{fill:#d8eef0;font:400 12.5px 'Atkinson Hyperlegible Next',system-ui,sans-serif}
.dg-arrow{fill:none;stroke:#3f5258;stroke-width:1.5}.dg-arrow-own{fill:none;stroke:#b8901a;stroke-width:1.5}
.dg-head{fill:#3f5258}.dg-head-own{fill:#b8901a}
@media (prefers-color-scheme:dark){
.dg-bg{fill:#0e1517}.dg-frame{stroke:#3b4d51}.dg-box{fill:#152024;stroke:#3b4d51}
.dg-core{fill:#73c3cc}.dg-own{fill:#2a2512;stroke:#b8901a}
.dg-t{fill:#e6eeef}.dg-s,.dg-h{fill:#b2c1c4}.dg-core-t{fill:#0b1214}.dg-core-s{fill:#123a40}
.dg-arrow{stroke:#b2c1c4}.dg-head{fill:#b2c1c4}.dg-arrow-own{stroke:#e3b831}.dg-head-own{fill:#e3b831}}
</style><rect class="dg-bg" x="0" y="0" width="360" height="920"/><text class="dg-h" x="16" y="20" text-anchor="start"><tspan x="16" dy="0">FONTES PÚBLICAS DO TCESP</tspan></text><rect class="dg-box" x="16" y="30" width="328" height="50" rx="6"/><text class="dg-t" x="28" y="52" text-anchor="start"><tspan x="28" dy="0">Matriz oficial</tspan></text><text class="dg-s" x="28" y="71" text-anchor="start"><tspan x="28" dy="0">planilha de instrução</tspan></text><rect class="dg-box" x="16" y="88" width="328" height="50" rx="6"/><text class="dg-t" x="28" y="110" text-anchor="start"><tspan x="28" dy="0">Manual da edição</tspan></text><text class="dg-s" x="28" y="129" text-anchor="start"><tspan x="28" dy="0">fórmulas e regras</tspan></text><rect class="dg-box" x="16" y="146" width="328" height="50" rx="6"/><text class="dg-t" x="28" y="168" text-anchor="start"><tspan x="28" dy="0">CSV de respostas</tspan></text><text class="dg-s" x="28" y="187" text-anchor="start"><tspan x="28" dy="0">painel, por ano-base</tspan></text><rect class="dg-box" x="16" y="204" width="328" height="50" rx="6"/><text class="dg-t" x="28" y="226" text-anchor="start"><tspan x="28" dy="0">Faixas oficiais</tspan></text><text class="dg-s" x="28" y="245" text-anchor="start"><tspan x="28" dy="0">painel, 644 municípios</tspan></text><text class="dg-h" x="16" y="284" text-anchor="start"><tspan x="16" dy="0">DADOS DO PRÓPRIO MUNICÍPIO</tspan></text><rect class="dg-own" x="16" y="294" width="328" height="72" rx="6"/><text class="dg-t" x="28" y="316" text-anchor="start"><tspan x="28" dy="0">AUDESP e balancetes</tspan></text><text class="dg-s" x="28" y="335" text-anchor="start"><tspan x="28" dy="0">preenchimento prévio de itens calculados:</tspan><tspan x="28" dy="16">i-Fiscal 850 e i-Plan 650 de 1000 pontos</tspan></text><rect class="dg-box" x="16" y="402" width="328" height="56" rx="6"/><text class="dg-t" x="28" y="424" text-anchor="start"><tspan x="28" dy="0">Ingestão</tspan></text><text class="dg-s" x="28" y="443" text-anchor="start"><tspan x="28" dy="0">versionada por edição do índice</tspan></text><rect class="dg-core" x="16" y="494" width="328" height="92" rx="6"/><text class="dg-core-t" x="28" y="516" text-anchor="start"><tspan x="28" dy="0">Motor de cálculo</tspan></text><text class="dg-core-s" x="28" y="535" text-anchor="start"><tspan x="28" dy="0">sete índices, rebaixamentos e faixa geral</tspan><tspan x="28" dy="16">regras abertas</tspan></text><rect class="dg-box" x="16" y="622" width="328" height="56" rx="6"/><text class="dg-t" x="28" y="644" text-anchor="start"><tspan x="28" dy="0">Validação</tspan></text><text class="dg-s" x="28" y="663" text-anchor="start"><tspan x="28" dy="0">contra 644 municípios em 11 anos-base</tspan></text><rect class="dg-box" x="16" y="714" width="328" height="76" rx="6"/><text class="dg-t" x="28" y="736" text-anchor="start"><tspan x="28" dy="0">Diagnóstico</tspan></text><text class="dg-s" x="28" y="755" text-anchor="start"><tspan x="28" dy="0">pontos na mesa: norma, processo ou</tspan><tspan x="28" dy="16">investimento; simulação e se</tspan></text><rect class="dg-box" x="16" y="826" width="160" height="76" rx="6"/><text class="dg-t" x="28" y="848" text-anchor="start"><tspan x="28" dy="0">Relatório</tspan></text><text class="dg-s" x="28" y="867" text-anchor="start"><tspan x="28" dy="0">prefeito e</tspan><tspan x="28" dy="16">secretarias</tspan></text><rect class="dg-box" x="184" y="826" width="160" height="76" rx="6"/><text class="dg-t" x="196" y="848" text-anchor="start"><tspan x="196" dy="0">Evidências</tspan></text><text class="dg-s" x="196" y="867" text-anchor="start"><tspan x="196" dy="0">documento por</tspan><tspan x="196" dy="16">resposta Sim</tspan></text><path class="dg-arrow" d="M16,113 L6,113"/><path class="dg-arrow" d="M16,171 L6,171"/><path class="dg-arrow" d="M16,55 L6,55 L6,430 L16,430"/><path class="dg-head" d="M16,430 L8,425.5 L8,434.5 Z"/><path class="dg-arrow-own" d="M180,366 L180,402"/><path class="dg-head-own" d="M180,402 L175.5,394 L184.5,394 Z"/><path class="dg-arrow" d="M180,458 L180,494"/><path class="dg-head" d="M180,494 L175.5,486 L184.5,486 Z"/><path class="dg-arrow" d="M180,622 L180,586"/><path class="dg-head" d="M180,586 L175.5,594 L184.5,594 Z"/><path class="dg-arrow" d="M344,229 L354,229 L354,650 L344,650"/><path class="dg-head" d="M344,650 L352,645.5 L352,654.5 Z"/><path class="dg-arrow" d="M16,560 L6,560 L6,752 L16,752"/><path class="dg-head" d="M16,752 L8,747.5 L8,756.5 Z"/><path class="dg-arrow" d="M96,790 L96,826"/><path class="dg-head" d="M96,826 L91.5,818 L100.5,818 Z"/><path class="dg-arrow" d="M264,790 L264,826"/><path class="dg-head" d="M264,826 L259.5,818 L268.5,818 Z"/></svg>
